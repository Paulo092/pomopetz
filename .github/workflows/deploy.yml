# Publica o Pomopetz no GitHub Pages a cada push na branch master.
# Também pode ser disparado manualmente na aba Actions ("Run workflow").
name: Publicar no GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Se dois pushes chegarem juntos, só o mais recente é publicado
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # o Vite 8 exige Node 20.19+
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o build
        run: npm run build

      - name: Enviar o build para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
